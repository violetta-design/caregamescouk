/* Layout: one warm kitchen-book column (max 760px), bunting header, photo-led recipe cards, big tap targets for cooking with messy hands */
:root{
  --paper:#fdf6e8; --card:#fffaf0; --white:#ffffff; --ink:#2f2a26; --soft:#6b5a4a; --line:#ead9b8;
  --red:#c8312b; --red-d:#9c221d; --navy:#1f3b6e; --green:#2f6b45;
  --pink:#fde3e3; --pink-b:#f1b7b7; --pink-h:#a8261f;
  --blue:#e3eef9; --blue-b:#b4cde8;
  --yellow:#fff1c9; --yellow-b:#f0d68a; --yellow-h:#8a5a00;
  --mint:#e6f2e2; --mint-b:#b9d8b0;
  --lilac:#efe6f7; --lilac-b:#cdb7e4; --lilac-h:#6a3d96; --lilac-dot:#8e63b8;
  --shadow:0 2px 8px rgba(80,50,20,.12);
  --display:Fredoka,"Trebuchet MS",system-ui,sans-serif; --body:Nunito,"Segoe UI",system-ui,sans-serif;
  --fs:17px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
#app{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible+span{outline:3px solid var(--navy);outline-offset:2px}
a{color:inherit}
img{max-width:100%;display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* bunting */
.bunting{display:block;width:100%;height:46px;margin-bottom:-6px}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;padding:10px 0 6px}
.bar .grow{flex:1;min-width:0;font-family:var(--display);font-weight:600;color:var(--navy);font-size:1rem;text-align:center}
.iconbtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;min-width:48px;height:48px;padding:0 14px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;color:var(--navy);font-size:.95rem}
.iconbtn{text-decoration:none}
.iconbtn svg{width:22px;height:22px}

/* home hero */
.hero{text-align:center;padding:4px 0 8px}
.hero .brand{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.hero h1{font-size:clamp(2rem,7vw,2.9rem);color:var(--red);font-weight:700;margin-top:4px}
.hero .month{display:inline-block;background:var(--navy);color:#fff;font-family:var(--display);font-weight:600;font-size:1.1rem;border-radius:999px;padding:3px 18px;margin-top:6px}
.hello{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;margin:16px 0 18px}
.hello img{width:110px}
.bubble{position:relative;background:var(--white);border:2px solid var(--red);border-radius:22px;padding:14px 16px}
.bubble::before{content:"";position:absolute;left:-14px;top:42%;border:9px solid transparent;border-right:13px solid var(--red)}
.bubble::after{content:"";position:absolute;left:-9px;top:calc(42% + 2px);border:7px solid transparent;border-right:10px solid var(--white)}
.bubble p{margin:0}
.bubble .who{font-family:var(--display);font-weight:600;color:var(--red);font-size:1.1rem;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* section chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-family:var(--display);font-weight:600;font-size:1rem;color:var(--navy)}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}

/* recipe cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.rcard{display:flex;flex-direction:column;text-decoration:none;background:var(--white);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.rcard img{width:100%;aspect-ratio:4/3;object-fit:cover}
.rcard .t{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.rcard .n{font-family:var(--display);font-weight:600;font-size:1.05rem;color:var(--red);line-height:1.2}
.rcard .d{font-size:.82rem;color:var(--soft);line-height:1.35}
.rcard .num{font-size:.75rem;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.06em}
.note{display:block;text-decoration:none;margin-top:18px;background:var(--yellow);border:1.5px solid var(--yellow-b);border-radius:18px;padding:14px 16px}
.note h2{color:var(--yellow-h);font-size:1.15rem;margin-bottom:2px}
.note p{margin:0;font-size:.92rem}

/* recipe header */
.photo{border:6px solid var(--white);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.photo img{width:100%;aspect-ratio:16/10;object-fit:cover}
.ribbon{display:flex;justify-content:center;margin:-26px 18px 8px;position:relative}
.ribbon span{background:var(--red);color:#fff;font-family:var(--display);font-weight:700;font-size:clamp(1.45rem,5.5vw,2rem);line-height:1.1;
  padding:8px 22px 10px;border-radius:8px;box-shadow:0 4px 0 var(--red-d);text-align:center;text-wrap:balance}
.tagline{text-align:center;font-weight:700;color:var(--soft);margin:6px 0 8px}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:14px}
.meta span{background:var(--white);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.88rem;color:var(--green)}
.meta b{color:var(--red)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:5px;margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tab{border:0;background:transparent;border-radius:13px;padding:10px 4px;font-family:var(--display);font-weight:600;font-size:.98rem;color:var(--navy);line-height:1.15}
.tab[aria-selected="true"]{background:var(--red);color:#fff}

/* boxes */
.box{border-radius:18px;padding:14px 16px;border:1.5px solid;margin-bottom:12px}
.box h2{font-size:1.2rem;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.box p{margin:0 0 6px}
.box p:last-child{margin-bottom:0}
.box ul,.box ol{margin:0;padding:0;list-style:none}
.box ul.dots li{position:relative;padding-left:18px;margin-bottom:5px}
.box ul.dots li::before{content:"";position:absolute;left:2px;top:.62em;width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.45}
.box h3{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:4px 0 6px}
.cream{background:var(--card);border-color:var(--line)} .cream h2{color:var(--red)}
.whitebox{background:var(--white);border-color:var(--line)} .whitebox h2{color:var(--red)}
.pink{background:var(--pink);border-color:var(--pink-b)} .pink h2{color:var(--pink-h)}
.blue{background:var(--blue);border-color:var(--blue-b)} .blue h2{color:var(--navy)}
.yellow{background:var(--yellow);border-color:var(--yellow-b)} .yellow h2{color:var(--yellow-h)}
.mint{background:var(--mint);border-color:var(--mint-b)} .mint h2{color:var(--green)}
.lilac{background:var(--lilac);border-color:var(--lilac-b)} .lilac h2{color:var(--lilac-h)}
.expert ol{counter-reset:e;display:grid;gap:8px}
.expert li{counter-increment:e;position:relative;padding-left:34px;min-height:26px}
.expert li::before{content:counter(e);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--lilac-dot);color:#fff;font-family:var(--display);font-weight:600;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.sub{font-style:italic;color:var(--lilac-h)}
.words{font-weight:800;color:var(--navy);line-height:1.6}
.why{font-style:italic;color:var(--soft);margin-top:8px!important}
.airfryer,.safety{margin-top:12px;border-radius:14px;padding:10px 14px}
.airfryer{background:var(--blue);border:1.5px solid var(--blue-b)} .airfryer h3{color:var(--navy)}
.safety{background:var(--yellow);border:1.5px solid var(--yellow-b)} .safety h3{color:var(--yellow-h)}
.hot{margin-top:10px;background:var(--yellow);border:1.5px solid var(--yellow-b);border-radius:14px;padding:10px 14px;font-weight:700}

/* speak button */
.say{flex:none;border:1.5px solid currentColor;background:var(--white);border-radius:999px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;color:inherit;opacity:.9}
.say svg{width:20px;height:20px}
.say.on{background:currentColor}
.say.on svg{color:var(--white)}
.nosay .say{display:none}

/* reveal */
.reveal{border:2px dashed currentColor;background:var(--white);border-radius:14px;padding:10px 14px;width:100%;text-align:center;font-weight:800;color:var(--navy);margin-top:6px}
.answers{font-weight:700;color:var(--navy);background:var(--white);border-radius:12px;padding:8px 12px;margin-top:6px!important;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.94);opacity:.3}to{transform:none;opacity:1}}

/* basket */
.checks li{margin-bottom:2px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:8px 2px;cursor:pointer}
.checks input{position:absolute;opacity:0;width:1px;height:1px}
.checks .tick{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--green);background:var(--white);display:flex;align-items:center;justify-content:center;margin-top:-1px}
.checks .tick svg{width:18px;height:18px;opacity:0;color:#fff}
.checks input:checked+.tick{background:var(--green)}
.checks input:checked+.tick svg{opacity:1}
.checks input:checked~.lbl{text-decoration:line-through;color:var(--soft)}
.basket-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:6px}
.basket-foot img{width:120px}
.backbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:2px solid var(--navy);background:var(--white);color:var(--navy);border-radius:18px;padding:14px;font-family:var(--display);font-weight:600;font-size:1.15rem;text-decoration:none;margin:8px 0 4px}
.backbtn svg{width:24px;height:24px}
.link{border:0;background:none;text-decoration:underline;color:var(--soft);font-weight:700;padding:6px 0}

/* steps */
.steps{counter-reset:s}
.steps li{counter-increment:s;position:relative;padding-left:42px;margin-bottom:14px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--display);font-weight:600;display:flex;align-items:center;justify-content:center}
.timers{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tbtn{border:1.5px solid var(--green);background:var(--mint);color:var(--green);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
.tbtn svg{width:18px;height:18px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;background:var(--red);color:#fff;font-family:var(--display);font-weight:600;font-size:1.25rem;border-radius:18px;padding:16px;box-shadow:0 4px 0 var(--red-d);margin-bottom:16px}
.big svg{width:26px;height:26px}

/* joke */
.jokerow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:14px}
.jokerow img{width:96px}
.punch{font-weight:800;color:var(--navy);font-size:1.12rem}
.explain{font-style:italic;color:var(--soft);font-size:.9rem}
.says{text-align:center;font-family:var(--display);font-weight:600;color:var(--red);font-size:1.15rem;margin:18px 0}

/* cook mode */
.cookmode{min-height:70vh;display:flex;flex-direction:column}
.progress{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:4px 0 14px}
.progress i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
.stepnum{font-family:var(--display);font-weight:600;color:var(--green);font-size:1.1rem}
.steptext{font-size:clamp(1.4rem,5.2vw,1.85rem);line-height:1.4;font-weight:700;margin:10px 0 16px}
.cookmode .timers .tbtn{font-size:1.05rem;padding:10px 16px}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto;padding-top:20px}
.navrow button{border:2px solid var(--navy);background:var(--white);color:var(--navy);border-radius:18px;padding:16px;font-family:var(--display);font-weight:600;font-size:1.2rem}
.navrow .next{background:var(--navy);color:#fff}
.navrow button:disabled{opacity:.35}
.readrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.readbtn{border:2px solid var(--red);background:var(--white);color:var(--red);border-radius:999px;padding:10px 18px;font-weight:800;display:inline-flex;gap:8px;align-items:center}
.readbtn.on{background:var(--red);color:#fff}
.readbtn svg{width:22px;height:22px}
.done{text-align:center;padding:20px 0}
.done img{width:150px;margin:0 auto 10px}
.done h2{color:var(--red);font-size:1.8rem;margin-bottom:6px}

/* timer tray */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tchip{pointer-events:auto;width:100%;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tchip .lab{flex:1;min-width:0;font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tchip .time{font-family:var(--display);font-weight:600;font-size:1.35rem;font-variant-numeric:tabular-nums}
.tchip button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;min-width:40px;height:40px;font-weight:800;padding:0 10px}
.tchip.ring{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}

/* modal */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(40,25,10,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:520px;background:var(--paper);border-radius:24px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:up .3s ease;max-height:90vh;overflow:auto}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h2{color:var(--red);font-size:1.4rem;margin-bottom:8px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sheet .row button{flex:1;min-width:120px}
.btn{border:2px solid var(--navy);background:var(--white);color:var(--navy);border-radius:14px;padding:12px 14px;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px;flex:none}
.btn.solid{background:var(--navy);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.set{margin:12px 0}
.set .lab{font-weight:800;margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--white);border-radius:12px;padding:9px 14px;font-weight:800;color:var(--navy)}
.seg button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.hint{font-size:.85rem;color:var(--soft);margin-top:4px}
.chat{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start}
.chat img{width:84px}
.small{font-size:.85rem;color:var(--soft)}
footer.foot{text-align:center;font-size:.82rem;color:var(--soft);margin:26px 0 10px}

/* free-sample extras */
.samplebar{position:sticky;top:0;z-index:15;max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--navy);color:#fff;border-radius:0 0 16px 16px;padding:8px 8px 8px 16px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.samplebar span{font-family:var(--display);font-weight:600;font-size:.98rem;line-height:1.2}
.samplebar a{flex:none;background:var(--red);color:#fff;text-decoration:none;font-family:var(--display);font-weight:600;font-size:.95rem;border-radius:999px;padding:9px 16px;white-space:nowrap}
.buybox{background:var(--yellow);border:2px solid var(--yellow-b);margin-top:22px}
.buybox h2{color:var(--yellow-h)}
.buybox .big{margin:12px 0 8px;text-decoration:none}

</style>
</head>

const DATA=[{"id": "ps", "name": "Free Sample", "recipes": [{"id": "w1-2", "title": "Cottage Pie", "tagline": "A cosy British family favourite", "alt": "Cottage pie with golden mash in a white dish", "meta": [["Serves", "2–3"], ["Preparation", "15 minutes"], ["Cooking", "about 50 minutes"]], "basket": ["300 g minced beef", "500 g potatoes (Maris Piper or King Edward)", "1 onion", "2 carrots", "100 g frozen peas", "1 tbsp tomato purée", "300 ml beef stock (1 stock cube and boiling water)", "1 tbsp vegetable oil", "A splash of milk and a knob of butter for the mash", "1 tsp Worcestershire sauce (optional)", "Salt and pepper"], "steps": ["Heat the oven to 200°C (180°C fan, gas mark 6).", "Peel the potatoes and cut them into even pieces. Boil for 15–20 minutes until soft.", "While the potatoes cook, finely chop the onion and carrots. Soften them in the oil in a frying pan for about 5 minutes.", "Add the beef. Cook, breaking up any lumps, until there is no pink meat left.", "Stir in the tomato purée, stock, and the Worcestershire sauce if using. Simmer for 15 minutes, adding the peas for the last 5 minutes.", "Drain the potatoes and mash with the milk and butter. Season to taste.", "Spoon the beef into an ovenproof dish. Cover with the mash and draw lines on top with a fork.", "Bake for 20–25 minutes until golden and bubbling, and piping hot in the middle.", "Let it cool for a few minutes before serving. The filling stays very hot."], "cookExtra": "", "p1boxes": [], "joke": {"title": "Poppy's Little Mischief!", "q": "What do you call a potato watching TV?", "punch": "A couch potato!", "explain": "Poppy explains: a \"couch potato\" is someone who sits on the sofa watching TV all day!"}, "boxes": [{"cls": ["pink"], "title": "Let's Play! Which Pie?", "html": "<p>Which pie is made with beef: Cottage Pie or Shepherd's Pie?</p>\n<p class=\"answers\">Answer: Cottage Pie. Shepherd's Pie uses lamb.</p>"}, {"cls": ["blue"], "title": "Did You Know?", "html": "<p>Cottage pie got its name because it was a cheap, simple meal for people living in country cottages.</p>"}, {"cls": ["yellow"], "title": "Making It Easier to Eat", "html": "<ul class=\"dots\">\n<li>This is already one of the easiest meals to eat, because it is soft and moist.</li>\n<li>Chop the carrots very finely, or grate them, so there are no hard pieces.</li>\n<li>Add a little extra stock if the filling looks dry.</li>\n<li>Leave out the crispy top layer, or serve from the middle of the dish.</li>\n</ul>"}, {"cls": ["lilac", "expert"], "title": "You're the Expert!", "html": "<p class=\"sub\">Ask the person you're cooking with to share their know-how.</p>\n<ol>\n<li>Did you make lines on the mash with a fork, or keep it smooth?</li>\n<li>Cottage Pie or Shepherd's Pie: which was made more in your house?</li>\n<li>Did you put carrots and peas in, or keep it just meat?</li>\n<li>Was there ever cheese on top?</li>\n</ol>"}, {"cls": ["mint"], "title": "A Moment to Share", "html": "<p>What do you remember having with cottage pie?</p>"}, {"cls": ["blue"], "title": "Carer's Corner", "html": "<p>Invite the person to make fork lines in the mash or choose the vegetables.</p>"}, {"cls": ["pink"], "title": "Serving Suggestions", "html": "<p>Serve warm, allowing the hot filling to cool a little first. A few extra peas or soft vegetables can add colour to the plate.</p>"}], "says": "Poppy says: the best ingredient is time together! ♥"}]}];

const store={get(k,d){try{const v=localStorage.getItem('bcks:'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem('bcks:'+k,JSON.stringify(v))}catch(e){}}};
const S=Object.assign({auto:true,chat:3,size:17,group:'w1',style:'cheerful',chirp:true,vname:''},store.get('settings',{}));
function saveS(){store.set('settings',S);document.documentElement.style.setProperty('--fs',S.size+'px')}
saveS();

/* ---------- data helpers ---------- */
const RECIPES={};DATA.forEach(g=>g.recipes.forEach((r,i)=>{r.group=g;r.n=i+1;RECIPES[r.id]=r}));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim()};

/* ---------- Poppy's voice ---------- */
let voice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices();if(!vs.length)return;
  const gb=vs.filter(v=>/en[-_]GB/i.test(v.lang));
  voice=(S.vname&&vs.find(v=>v.name===S.vname))
    ||gb.find(v=>/natural|online/i.test(v.name)&&/female|libby|sonia|maisie|hollie|bella|abbi/i.test(v.name))
    ||gb.find(v=>/natural|online/i.test(v.name))
    ||gb.find(v=>/female|libby|sonia|serena|kate|martha|hazel|susan/i.test(v.name))||gb.find(v=>/google/i.test(v.name))||gb[0]||vs.find(v=>/^en/i.test(v.lang))||null;
}
function englishVoices(){try{return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>(/GB/.test(b.lang)-/GB/.test(a.lang))||a.name.localeCompare(b.name))}catch(e){return[]}}
const STYLES={cheerful:{pitch:1.65,rate:1.02},gentle:{pitch:1.35,rate:.85},calm:{pitch:1.1,rate:.92}};
/* a little robin chirp before Poppy speaks */
function tweet(){
  if(!actx)return;
  const t0=actx.currentTime;
  [[0,2600,4200],[.11,3000,4600],[.22,2800,3900]].forEach(([d,f1,f2])=>{
    const o=actx.createOscillator(),g=actx.createGain(),t=t0+d;
    o.type='sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+.07);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.09);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.1)});
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
let sayTimer=null;
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function forSpeech(t){
  return t.replace(/(\d+)\s*°C/g,'$1 degrees').replace(/(\d)\s*[–-]\s*(\d)/g,'$1 to $2')
   .replace(/\b1 tbsp\b/g,'1 tablespoon').replace(/\btbsp\b/g,'tablespoons').replace(/\b1 tsp\b/g,'1 teaspoon').replace(/\btsp\b/g,'teaspoons')
   .replace(/(\d)\s?kg\b/g,'$1 kilograms').replace(/(\d)\s?g\b/g,'$1 grams').replace(/(\d)\s?ml\b/g,'$1 millilitres')
   .replace(/[·♥]/g,', ').replace(/…/g,'.');
}
let speakingBtn=null;
function say(text,btn,then){
  if(!('speechSynthesis' in window)){toast('Poppy can\'t talk in this window. Open the app file in Chrome to hear her read aloud.');return}
  const wasThis=speakingBtn&&speakingBtn===btn;
  stopSpeaking();
  if(wasThis)return;
  const u=new SpeechSynthesisUtterance(forSpeech(text));
  const st=STYLES[S.style]||STYLES.cheerful;
  if(voice)u.voice=voice;u.lang='en-GB';u.pitch=st.pitch;u.rate=st.rate;
  if(btn){speakingBtn=btn;btn.classList.add('on');if(!btn.dataset.orig)btn.dataset.orig=btn.innerHTML;btn.innerHTML=btn.classList.contains('say')?ICON.stop:ICON.stop+' Stop reading';btn.setAttribute('aria-label','Stop reading')}
  u.onend=u.onerror=()=>{resetBtn(btn);if(then)then()};
  if(S.chirp&&actx){tweet();sayTimer=setTimeout(()=>{sayTimer=null;speechSynthesis.speak(u)},420)}else speechSynthesis.speak(u);
}
function resetBtn(b){if(!b)return;b.classList.remove('on');b.innerHTML=b.dataset.orig||ICON.speak;b.setAttribute('aria-label','Read aloud');if(speakingBtn===b)speakingBtn=null}
function stopSpeaking(){if(sayTimer){clearTimeout(sayTimer);sayTimer=null}if('speechSynthesis' in window)speechSynthesis.cancel();resetBtn(speakingBtn)}
const sayBtn=(id)=>`<button class="say" data-say="${id}" aria-label="Read aloud">${ICON.speak}</button>`;
const SAYS={};let sayN=0;
function sayable(text){const id='s'+(++sayN);SAYS[id]=text;return sayBtn(id)}

/* ---------- bunting ---------- */
function bunting(){
  const cols=['#c8312b','#fdfdfd','#1f3b6e'],n=14,W=760;let p='';
  const y=x=>{const u=x/W;return (1-u)*(1-u)*4+2*u*(1-u)*24+u*u*4};
  for(let i=0;i<n;i++){const x0=i*(W/n)+3,x1=x0+W/n-6,xm=(x0+x1)/2;
    p+=`<path d="M${x0} ${y(x0)} L${x1} ${y(x1)} L${xm} ${y(xm)+20} Z" fill="${cols[i%3]}" stroke="#d9c9a8"/>`}
  return `<svg class="bunting" viewBox="0 0 ${W} 46" preserveAspectRatio="none" aria-hidden="true"><path d="M0 4 Q${W/2} 44 ${W} 4" stroke="#8a6b4a" stroke-width="2" fill="none"/>${p}</svg>`;
}

/* ---------- timers ---------- */
let timers=store.get('timers',[]);let tid=Date.now();
function durations(text){
  const out=[];const re=/(\d+)(?:\s*[–-]\s*(\d+))?\s*(hours?|minutes?)/g;let m;
  while((m=re.exec(text))){const mult=/hour/.test(m[3])?60:1;const a=+m[1]*mult;
    if(a>=1&&a<=600&&!out.includes(a))out.push(a)}
  return out;
}
const fmtMin=m=>m>=60?(m%60?`${Math.floor(m/60)} hr ${m%60} min`:`${m/60} hr`):`${m} min`;
function timerBtns(r,stepIdx){
  const d=durations(r.steps[stepIdx]);if(!d.length)return'';
  return `<div class="timers">${d.map(m=>`<button class="tbtn" data-timer="${r.id}|${stepIdx}|${m}">${ICON.timer} Timer ${fmtMin(m)}</button>`).join('')}</div>`;
}
function startTimer(rid,step,mins){
  unlockAudio();
  const r=RECIPES[rid];
  timers.push({id:++tid,label:`${r.title} · step ${+step+1}`,text:r.steps[step],end:Date.now()+mins*60000,mins:+mins});
  if(lastChat===0||!timers.some(t=>t.end>Date.now()&&t.id!==tid))lastChat=Date.now();
  store.set('timers',timers);drawTray();
  toast(`Timer set for ${fmtMin(mins)}. Poppy will tell you when it's done.`);
}
function fmt(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')}
function drawTray(){
  const now=Date.now();
  document.getElementById('tray').innerHTML=timers.map(t=>{const left=t.end-now,ring=left<=0;
    return `<div class="tchip${ring?' ring':''}"><span class="lab">${ring?"Time's up! ":''}${esc(t.label)}</span><span class="time">${ring?'0:00':fmt(left)}</span>
      ${ring?'':`<button data-add="${t.id}" aria-label="Add one minute">+1</button>`}<button data-cancel="${t.id}" aria-label="${ring?'Stop alarm':'Cancel timer'}">${ring?'OK':'✕'}</button></div>`}).join('');
}
let rung=new Set(),lastChat=0,lastBeep=0;
setInterval(()=>{
  const now=Date.now();
  timers.forEach(t=>{if(t.end<=now&&!rung.has(t.id)){rung.add(t.id);timeUp(t)}});
  const ringing=timers.some(t=>t.end<=now);
  if(ringing&&now-lastBeep>4000){lastBeep=now;chime()}
  const running=timers.some(t=>t.end>now);
  if(running&&S.chat>0&&!document.querySelector('.scrim')&&now-lastChat>=S.chat*60000){lastChat=now;poppyChat()}
  if(timers.length)drawTray();
},1000);
function timeUp(t){
  openModal(`<div class="chat"><img src="${IMG.poppy_wave}" alt="Poppy the robin waving"><div>
    <h2>Ding! Time's up!</h2><p><b>${esc(t.label)}</b></p><p>${esc(t.text)}</p></div></div>
    <div class="row"><button class="btn solid" data-cancel="${t.id}" data-close>OK, thanks Poppy!</button></div>`);
  if(S.auto)say(`Ding ding! Time's up! ${t.label}.`);
}
/* simple kitchen chime with Web Audio */
let actx=null;
function unlockAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function chime(){
  if(!actx)return;
  [880,1175,1568].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*.18;
    o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.6);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.65)});
}

/* ---------- Poppy chats while you wait ---------- */
const POOL=[];
DATA.forEach(g=>g.recipes.forEach(r=>{
  POOL.push({k:'joke',r,title:r.joke.title,q:r.joke.q,a:r.joke.punch,x:r.joke.explain});
  r.boxes.forEach(b=>{
    const d=document.createElement('div');d.innerHTML=b.html;
    if(b.cls.includes('expert'))d.querySelectorAll('li').forEach(li=>POOL.push({k:'q',r,title:"You're the Expert!",q:li.textContent.trim()}));
    else if(/Moment to Share/.test(b.title))POOL.push({k:'q',r,title:'A Moment to Share',q:d.textContent.trim()});
    else if(/Did You Know/.test(b.title))POOL.push({k:'fact',r,title:'Did You Know?',q:d.textContent.trim()});
  });
}));
let chatOrder=[];
function poppyChat(){
  if(!chatOrder.length){chatOrder=POOL.map((_,i)=>i);for(let i=chatOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[chatOrder[i],chatOrder[j]]=[chatOrder[j],chatOrder[i]]}}
  const c=POOL[chatOrder.pop()];
  const intro={joke:"Here's a joke while we wait!",q:"A little question while we wait…",fact:"Here's something fun while we wait…"}[c.k];
  openModal(`<div class="chat"><img src="${IMG.poppy_wave}" alt="Poppy the robin waving"><div>
     <p class="small">${intro}</p><h2>${esc(c.title)}</h2><p style="font-size:1.12rem">${esc(c.q)}</p>
     ${c.k==='joke'?`<button class="reveal" data-revealjoke>Tap for the answer</button><div hidden id="cj"><p class="punch">${esc(c.a)}</p>${c.x?`<p class="explain">${esc(c.x)}</p>`:''}</div>`:''}
     <p class="small" style="margin-top:8px">From ${esc(c.r.title)}</p></div></div>
     <div class="row"><button class="btn" data-say="chatq">${ICON.speak} Read it</button><button class="btn solid" data-close>Thanks Poppy!</button></div>`);
  SAYS.chatq=intro+' '+c.q; SAYS.chata=c.a+' '+(c.x||'');
  if(S.auto)say(SAYS.chatq);
}

/* ---------- modal & toast ---------- */
function openModal(html){document.getElementById('modal').innerHTML=`<div class="scrim" role="dialog" aria-modal="true"><div class="sheet">${html}</div></div>`;
  const f=document.querySelector('.sheet button');if(f)f.focus()}
function closeModal(){document.getElementById('modal').innerHTML='';stopSpeaking()}
function toast(msg){openModal(`<p style="font-weight:700;font-size:1.05rem;margin:0">${esc(msg)}</p><div class="row"><button class="btn solid" data-close>OK</button></div>`);
  clearTimeout(toast.t);toast.t=setTimeout(()=>{const s=document.querySelector('.sheet');if(s&&s.textContent.includes(msg))closeModal()},2600)}

function settings(){
  const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button aria-pressed="${S[key]==v}" data-set="${key}|${v}">${l}</button>`).join('')}</div>`;
  openModal(`<h2>Settings</h2>
   <div class="set"><div class="lab">Text size</div>${seg('size',[[16,'A'],[18,'A+'],[21,'A++']])}</div>
   <div class="set"><div class="lab">Poppy's voice</div>${seg('style',[['cheerful','Cheerful'],['gentle','Gentle and slow'],['calm','Calm']])}
     <p class="hint">Cheerful is bright and bouncy. Gentle and slow is easier to follow for some people.</p></div>
   <div class="set"><div class="lab">Which voice</div><select id="vsel" class="btn" style="width:100%;text-align:left">${englishVoices().map(v=>`<option value="${esc(v.name)}" ${voice&&v.name===voice.name?'selected':''}>${esc(v.name)}</option>`).join('')||'<option>Default voice</option>'}</select>
     <p class="hint">These are the voices on this device. Try a few and keep the one that sounds most like Poppy!</p></div>
   <div class="set"><div class="lab">Poppy chirps before she talks</div>${seg('chirp',[[true,'Yes'],[false,'No']])}</div>
   <div class="set"><div class="lab">Poppy reads aloud by herself</div>${seg('auto',[[true,'Yes'],[false,'No']])}
     <p class="hint">When on, Poppy reads each cooking step and her waiting-time chats out loud. You can always tap the speaker buttons.</p></div>
   <div class="set"><div class="lab">Poppy chats while a timer runs</div>${seg('chat',[[0,'Off'],[2,'Every 2 min'],[3,'Every 3 min'],[5,'Every 5 min']])}
     <p class="hint">A joke, a fun fact or a question to share while the food cooks.</p></div>
   <div class="row"><button class="btn" data-test>${ICON.speak} Hear Poppy</button><button class="btn solid" data-close>Done</button></div>`);
}

function recipeTop(r,tab){
  const tabs=[['shop','Shopping'],['cook',"Let's Cook!"],['share','Share & Smile']];
  return `${bunting()}<div class="bar"><a class="iconbtn" href="#home" aria-label="All recipes">${ICON.back} All recipes</a><span class="grow">Free sample</span><button class="iconbtn" data-settings aria-label="Settings">${ICON.gear}</button></div>
  <div class="photo"><img src="${IMG[r.id]}" alt="${esc(r.alt)}"></div>
  <div class="ribbon"><span>${esc(r.title)}</span></div>
  <p class="tagline">${esc(r.tagline)}</p>
  <div class="meta">${r.meta.map(([k,v])=>`<span><b>${esc(k)}</b> ${esc(v)}</span>`).join('')}</div>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<a class="tab" role="tab" aria-selected="${k===tab}" href="#${r.id}-${k}" style="text-decoration:none;text-align:center">${l}</a>`).join('')}</div>`;
}
function shop(r){
  const ticks=store.get('ticks:'+r.id,[]);
  return recipeTop(r,'shop')+`<div class="box cream"><h2>Shopping Basket ${sayable('Shopping basket. '+r.basket.join('. '))}</h2>
   <ul class="checks">${r.basket.map((b,i)=>`<li><label><input type="checkbox" id="b-${r.id}-${i}" data-tick="${r.id}|${i}" ${ticks.includes(i)?'checked':''}><span class="tick">${ICON.tick}</span><span class="lbl">${esc(b)}</span></label></li>`).join('')}</ul>
   <div class="basket-foot"><button class="link" data-clearticks="${r.id}">Clear all ticks</button><img src="${IMG.poppy_spoon}" alt="Poppy the robin holding a wooden spoon"></div></div>
  <a class="big" href="#${r.id}-step1">${ICON.play} Start cooking, step by step</a>${backBtn()}`;
}
function cook(r){
  return recipeTop(r,'cook')+`<a class="big" href="#${r.id}-step1">${ICON.play} Start cooking, step by step</a>
  <div class="box whitebox"><h2>Let's Cook! ${sayable("Let's cook! "+r.steps.map((s,i)=>'Step '+(i+1)+'. '+s).join(' '))}</h2>
   <ol class="steps">${r.steps.map((s,i)=>`<li>${esc(s)}${timerBtns(r,i)}</li>`).join('')}</ol>
   ${r.cookExtra}</div>${backBtn()}`;
}
function share(r){
  const boxes=r.boxes.map(b=>{
    const d=document.createElement('div');d.innerHTML=b.html;
    const ans=d.querySelector('.answers');let reveal='';
    if(ans){const a=ans.outerHTML;ans.remove();reveal=`<button class="reveal" data-reveal>Show the answer</button><template>${a}</template>`}
    return `<div class="box ${b.cls.join(' ')}"><h2>${esc(b.title)} ${sayable(b.title+'. '+d.textContent.replace(/\s+/g,' ').trim())}</h2>${d.innerHTML}${reveal}</div>`;
  }).join('');
  const j=r.joke;
  return recipeTop(r,'share')+`<div class="jokerow"><img src="${IMG.poppy_wave}" alt="Poppy the robin waving">
   <div class="bubble"><div class="who">${esc(j.title)} ${sayable(j.q)}</div><p style="font-size:1.1rem">${esc(j.q)}</p>
   <button class="reveal" data-revealpunch>Tap for the answer</button>
   <div hidden data-punch><p class="punch">${esc(j.punch)}</p>${j.explain?`<p class="explain">${esc(j.explain)}</p>`:''}</div></div></div>
   ${boxes}<p class="says">${esc(r.says)}</p>${backBtn()}`;
}
const backBtn=()=>`<a class="backbtn" href="#home">${ICON.back} Back to the recipe list</a>${buyBox()}`;
let wake=null;
async function keepAwake(on){try{if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}else if(!on&&wake){await wake.release();wake=null}}catch(e){}}
function step(r,n){
  const total=r.steps.length;
  if(n>total){
    return `${bunting()}<div class="bar"><a class="iconbtn" href="#${r.id}-cook">${ICON.back} Recipe</a><span class="grow">${esc(r.title)}</span><span style="width:48px"></span></div>
    <div class="done"><img src="${IMG.poppy_spoon}" alt="Poppy the robin holding a wooden spoon"><h2>Well done, you've finished!</h2>
     <p>Enjoy your meal together. While you eat, there's a joke and some questions to share.</p></div>
    <a class="big" href="#${r.id}-share">Go to Share &amp; Smile</a><p class="says">${esc(r.says)}</p>${backBtn()}`;
  }
  const t=r.steps[n-1];
  return `${bunting()}<div class="bar"><a class="iconbtn" href="#${r.id}-cook" aria-label="Back to the recipe">${ICON.back} Recipe</a><span class="grow">${esc(r.title)}</span><button class="iconbtn" data-settings aria-label="Settings">${ICON.gear}</button></div>
  <div class="cookmode"><div class="progress" aria-hidden="true"><i style="width:${(n-1)/total*100}%"></i></div>
   <div class="stepnum">Step ${n} of ${total}</div>
   <p class="steptext" id="steptext">${esc(t)}</p>
   <div class="readrow"><button class="readbtn" data-say="step">${ICON.speak} Read this step</button></div>
   ${timerBtns(r,n-1)}
   ${n===total&&r.cookExtra?`<div class="box whitebox" style="margin-top:16px">${r.cookExtra}</div>`:''}
   <div class="navrow"><button data-go="${r.id}-step${n-1}" ${n===1?'disabled':''}>‹ Back</button><button class="next" data-go="${r.id}-step${n+1}">${n===total?'Finish':'Next step ›'}</button></div></div>`;
}

/* ---------- router ---------- */
function route(){
  stopSpeaking();sayN=0;
  const h=decodeURIComponent(location.hash.slice(1))||'home';
  const m=h.match(/^(w\d-\d+|ps-\d+)-(shop|cook|share|step(\d+))$/);
  let html,cooking=false,stepSay=null;
  if(h==='about')html=about();
  else if(m&&RECIPES[m[1]]){const r=RECIPES[m[1]];
    if(m[3]){cooking=true;const n=+m[3];html=step(r,n);if(n<=r.steps.length)stepSay=(n===r.steps.length?pick([`Last step! `,`Final step, nearly there! `]):pick([`Step ${n}! Here we go. `,`Ooh, step ${n}! `,`Right then, step ${n}. `,`Step ${n}, my friend. `]))+r.steps[n-1]}
    else html={shop,cook,share}[m[2]](r)}
  else html=home();
  document.getElementById('app').innerHTML=html;
  keepAwake(cooking);
  if(stepSay){SAYS.step=stepSay;if(S.auto)setTimeout(()=>say(stepSay,document.querySelector('[data-say="step"]')),250)}
  if(!/-(cook|share|shop)$/.test(h)||!document.querySelector('.tabs'))window.scrollTo(0,0);
  else{const tb=document.querySelector('.tabs');if(tb&&window.scrollY>tb.offsetTop)window.scrollTo(0,tb.offsetTop-8)}
}
addEventListener('hashchange',route);

document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;
  const d=t.dataset;unlockAudio();
  if(d.say){e.preventDefault();const txt=SAYS[d.say];if(txt)say(txt,t.classList.contains('say')||t.classList.contains('readbtn')?t:null);return}
  if(d.timer){const [rid,s,m]=d.timer.split('|');startTimer(rid,s,m);return}
  if(d.cancel){timers=timers.filter(x=>x.id!=d.cancel);rung.delete(+d.cancel);store.set('timers',timers);drawTray();if(!timers.some(x=>x.end<=Date.now()))lastBeep=0}
  if(d.add){const x=timers.find(x=>x.id==d.add);if(x){x.end+=60000;store.set('timers',timers);drawTray()}return}
  if('close' in d){closeModal();return}
  if(d.group){S.group=d.group;saveS();route();return}
  if('settings' in d){settings();return}
  if('test' in d){say(pick(["Tweet tweet! Hello, I'm Poppy! Shall we cook something lovely together?","Hello hello! It's Poppy! What are we cooking today?","Hello, my friend! Poppy here, ready to cook!"]));return}
  if(d.set){const [k,v]=d.set.split('|');S[k]=v==='true'?true:v==='false'?false:isNaN(+v)?v:+v;saveS();settings();if(k==='chat')lastChat=Date.now();return}
  if(d.go){location.hash=d.go;return}
  if('reveal' in d){const tpl=t.nextElementSibling;t.insertAdjacentHTML('afterend',tpl.innerHTML);t.remove();return}
  if('revealpunch' in d){const p=t.parentElement.querySelector('[data-punch]');p.hidden=false;t.remove();say(p.textContent.replace(/\s+/g,' '));return}
  if('revealjoke' in d){const p=document.getElementById('cj');p.hidden=false;t.remove();say(SAYS.chata);return}
  if(d.clearticks){store.set('ticks:'+d.clearticks,[]);document.querySelectorAll('[data-tick]').forEach(c=>c.checked=false);return}
});
document.addEventListener('change',e=>{
  if(e.target.id==='vsel'){S.vname=e.target.value;saveS();pickVoice();unlockAudio();say("Hello! I'm Poppy. Do you like this voice?");return}
  const c=e.target;if(!c.dataset.tick)return;const [rid,i]=c.dataset.tick.split('|');
  let a=store.get('ticks:'+rid,[]).filter(x=>x!=+i);if(c.checked)a.push(+i);store.set('ticks:'+rid,a);
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&/step\d+$/.test(location.hash))keepAwake(true)});
drawTray();route();
</script>
